# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   Dùng công thức hai tỉ lệ, kiểm định hai phía, z chính xác; làm tròn cỡ mẫu lên.
#   a) Chia theo yêu cầu: p2 = 0,75; cần 1.251 đơn mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + (75 - 1) × 0,02 = 2,48;
#      ceil(1.251 × 2,48) = 3.103 đơn mỗi nhóm; ceil(3.103/75) = 42 người mỗi bên;
#      tổng 84 > 40 nhân viên hiện có, không đủ người.
#   c) 20 nhân viên mỗi nhóm: trần n hiệu dụng = c/ICC = 1.000 < 1.251;
#      không đủ cho mức chênh 5 điểm dù tăng số đơn mỗi người.
#   d) 6 depot mỗi nhóm: trần n hiệu dụng = c/ICC = 300 < 1.251, không đủ.
#   e) Mức chênh 6 điểm: p2 = 0,76; cần 859 đơn hiệu dụng mỗi nhóm, 20 người mỗi bên.
#      m >= 859 × (1 - 0,02)/(20 - 859 × 0,02) = 298,52 -> m nhỏ nhất = 299 đơn/người.
#      DE = 1 + (299 - 1) × 0,02 = 6,96; n hiệu dụng = 20 × 299/6,96 = 859,20 >= 859.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng chạy song song cùng tuần và cùng 12 depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed chốt trước, phân tầng theo 12 depot (tỉ lệ 50% can thiệp, 50% đối chứng).
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chia sẻ gợi ý; giảm bằng khóa quyền truy cập trợ lý theo tài khoản staff_id và ghi log lượt mở cho cả 40 nhân viên.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính (baseline 70%, MDE 6 điểm), 3 luật dừng và ngày quyết định đều chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, chia theo nhân viên đạt đúng 20 cụm mỗi nhóm (≥ 20 cụm; loại chia theo depot vì chỉ có 6 cụm/nhóm và trần hiệu dụng 300 < 1.251).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia 20 nhân viên mỗi nhóm có cỡ mẫu hiệu dụng tối đa 1.000 (< 1.251 cần cho MDE 5 điểm), nên chấp nhận nâng MDE lên 6 điểm (n hiệu dụng = 859/nhóm, m ≥ 299 đơn/người, DE = 6,96; nếu tác động thật chỉ 5 điểm thì power giảm còn khoảng 0,64).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Đo trực tiếp từ src/logix_requests.csv: 51/1.200 = 4,25% toàn mẫu; 39/982 = 3,97% trong phạm vi noi_dia + hang_nang (noi_dia 26/824 = 3,16%, hang_nang 13/158 = 8,23%). Không đặt trần tuyệt đối 3% vì sẽ dừng giả ngay tuần 1; chọn ngưỡng so với nhóm đối chứng (+2 điểm phần trăm) kèm trần tuyệt đối 6,0% trong 3 ngày liên tiếp cho toàn phạm vi pilot và theo dõi tách riêng hang_nang.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí mỗi việc thành công 2.696 đ và 8.221 đ, tức 0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (22.515 đ, 1,88×) và doi_tac (10.215 đ, 0,85×) ra khỏi pilot theo A3"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4, 10, 20 nhân viên dùng trợ lý; chỉ đọc chỉ số chính từ bước 20 người
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm cần 1.251 đơn hiệu dụng nhưng 20 cụm chỉ cho tối đa 1.000
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng tuần và cùng 12 depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Có rủi ro nhân viên cùng depot chia sẻ gợi ý; giảm bằng khoá quyền truy cập trợ lý theo tài khoản staff_id và ghi log lượt mở cho cả 40 nhân viên"
    predeclared: "Có: chỉ số chính, ngưỡng, ba luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu; chia nhóm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot"
  stop_rules:
    - "NẾU có ít nhất 1 ca hoàn tiền hai lần cho cùng một đơn, hoặc thông báo đã hoàn nhưng sổ cái không ghi, hoặc tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý vượt 6% TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển mọi yêu cầu về luồng nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU từ bước 10 người trở đi, tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý cao hơn nhóm đối chứng từ 2 điểm TRONG 1 tuần THÌ Giám đốc vận hành dừng mở rộng và Kỹ sư trưởng agent rà 20 trace trong 3 ngày KHÔNG THÌ không được lên bước 20 người (bước 4 người chưa đủ cụm nên không dùng luật lệch 2 điểm)"
    - "NẾU chi phí mỗi việc thành công của toàn phạm vi pilot, chưa cộng tiền thuê cố định, vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang (tiền thuê cố định 40 triệu đ mỗi tháng không cộng vào ngưỡng này)"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ) vượt 40% TRONG 1 tuần (mốc chạy thử 27,12%) THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, có hiệu lực trong 30 phút; mọi yêu cầu được xử lý bằng luồng nhân viên tự làm (6 phút, 12.000 đ mỗi yêu cầu)"
  decision_date: "2027-01-14"     # giả định bắt đầu 2026-12-14; bước 20 người cần khoảng 10 ngày để gom 299 đơn mỗi người, cộng 7 ngày theo dõi mở lại
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí mỗi việc thành công 4.472 đ, 3.414 đ biến đổi và theo loại 2.696 / 8.221 / 22.515 / 10.215 đ", "mức 12.000 đ nhân viên tự làm 6 phút", "ngưỡng chi phí 8.000 đ"]
